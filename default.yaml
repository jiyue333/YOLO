# YOLO 实验模板配置
#
# 用法示例：
#   python script/train.py --config default.yaml
#   python script/train.py --config default.yaml --set train.epochs=300 --set hyperparameters.lr0=0.005
#   python script/val.py   --config default.yaml --model runs/experiments/yolo26_mhaf_data1_recipe/weights/best.pt
#
# 设计说明：
# 1. 该文件按“实验 / 模型 / 数据集 / 训练 / 验证 / 导出 ...”分组，便于做实验时快速阅读。
# 2. 每个内部字段名尽量与 Ultralytics 官方参数保持一致，方便对照文档。
# 3. script/train.py 与 script/val.py 会把这些分组自动展开成 Ultralytics 原生参数。
# 4. 当前仅保留 detect 任务实际会用到的参数；YOLO26 训练超参数以 YOLO26n 公开 recipe 为基准。

meta:
  config_version: 1 # 配置版本，仅用于备注，不会传给 YOLO
  description: "YOLO26 detect 小目标拥挤场景 COCO8 100 epoch validator 修复后排查配置" # 配置说明，仅用于备注

experiment:
  task: detect # 任务类型：detect | segment | classify | pose | obb
  mode: train # 仅作为记录；train.py 会强制用 train，val.py 会强制用 val
  project: runs/coco8 # 实验输出根目录，脚本会自动转为绝对路径
  name: mhaf_mafv2_coco8_100e_valfix_nbs2 # 当前实验名称，对应 project/name
  exist_ok: true # 是否允许复用已有同名实验目录
  verbose: true # 是否打印详细日志
  seed: 0 # 随机种子
  deterministic: false # 是否尽量保证可复现（通常更稳，但可能稍慢）

model:
  model: /Users/taless/Code/YOLO/ultralytics/ultralytics/cfg/models/26/yolo26-mhaf.yaml # MHAF-style YOLO26；P2 仅作辅助融合，检测头为 P3/P4/P5
  pretrained: yolo26n.pt # 加载 YOLO26n 预训练权重；结构不匹配层由 Ultralytics transfer 机制跳过
  freeze: null # 冻结层：null/0=不冻结；整数=冻结前 N 层；列表=指定层索引
  compile: false # 是否启用 torch.compile；可写 false/true/"default"/"reduce-overhead" 等

dataset:
  data: ultralytics/ultralytics/cfg/datasets/coco8.yaml # 每阶段提交前使用 COCO8 smoke
  fraction: 1.0 # 使用训练集的比例，1.0 表示全量数据
  single_cls: false # 是否把所有类别视为单类别任务

train:
  epochs: 100 # COCO8 指标排查
  time: null # 最大训练时长（单位：小时）；设置后会覆盖 epochs
  patience: 100 # 早停容忍轮数
  batch: 2 # COCO8 100 epoch 排查使用小 batch
  imgsz: 640 # 以 YOLO 标准 640 输入评估 P2/P3/P4/P5 结构
  save: true # 是否保存训练结果和权重
  save_period: -1 # 每 N 轮额外保存一次 checkpoint；<1 表示关闭
  cache: false # 是否缓存图像；可写 false/true/"ram"/"disk"
  device: cpu # 训练设备；如 0 / "cpu" / "mps" / [0,1]
  workers: 8 # smoke 避免多进程 dataloader 干扰
  optimizer: MuSGD # 对齐官方 YOLO26/Muon 配方优化器；参考 https://github.com/KellerJordan/Muon
  rect: false # 是否使用矩形训练批次
  cos_lr: true # SGDR/PyTorch Cosine LR；参考 https://arxiv.org/abs/1608.03983
  close_mosaic: 15 # YOLOX close_mosaic 策略：最后 10-15 epoch 关闭强增强
  resume: null # 干净启动 100 epoch；从 model.pretrained=yolo26n.pt 做迁移加载
  amp: true # 是否启用自动混合精度 AMP
  ema_decay: 0.9999 # Mean Teacher/Ultralytics EMA 最大衰减；参考 https://arxiv.org/abs/1703.01780
  profile: false # 训练时是否额外 profile ONNX/TensorRT 速度
  multi_scale: 0.5 # Ultralytics 多尺度训练：输入在 [0.5x, 1.5x] imgsz 间抖动；P5 主线保留

validation:
  val: true # 训练时是否同时跑验证
  split: val # 验证集划分：train | val | test
  save_json: false # 是否导出 COCO JSON 结果，便于外部评测
  conf: null # 置信度阈值；null 时让 Ultralytics 使用模式默认值
  iou: 0.7 # NMS 的 IoU 阈值（Ultralytics detect 默认值）；这是后处理阈值，不是训练 loss 的 IoU
  max_det: 3000 # 每张图最多保留多少检测框
  nms_max_time_img: 0.25 # dense/early validation 给 NMS 更多时间，避免 max_det=3000 + 低 conf 时截断指标
  half: false # 验证时是否启用 FP16
  dnn: false # 是否使用 OpenCV DNN（主要用于 ONNX 推理/验证）
  plots: true # 是否保存验证图表和样例图
  end2end: false # 关闭 YOLO26 one-to-one/e2e，验证使用 one-to-many + NMS
  visualize: false # 验证时可视化 TP/FP/FN 或预测特征

prediction:
  source: null # 推理源；可以是图片/文件夹/视频/摄像头/URL（train/val 脚本通常不会用到）
  vid_stride: 1 # 视频推理时每隔多少帧处理一次
  stream_buffer: false # 视频流是否缓存全部帧；低延迟场景一般保持 false
  inference_end2end: false # 推理关闭 e2e，使用 one-to-many head + NMS；参考 YOLOv10/Ultralytics
  sahi: true # 可选 SAHI 切片推理；未安装 sahi 时自动回退普通预测
  sahi_slice_size: 640 # SAHI slice 尺寸；参考 https://arxiv.org/abs/2202.06934 和 https://github.com/obss/sahi
  sahi_overlap: 0.25 # SAHI slice overlap ratio
  adaptive_nms: true # Adaptive NMS：根据局部 crowd density 动态放宽 IoU；参考 https://arxiv.org/abs/1904.03629
  adaptive_nms_max_iou: 0.75 # dense 区域 NMS IoU 上限
  adaptive_nms_density_threshold: 3 # 超过该局部邻居数时使用最大 IoU
  inference_augment: true # 推理时开启 Ultralytics TTA（多尺度 + 水平翻转）
  augment: false # 训练/验证 smoke 不启用 TTA；predict/track 由 inference_augment 映射
  agnostic_nms: false # 是否进行类别无关 NMS
  classes: null # 只保留指定类别，例如 [0, 2]
  embed: null # 提取指定层的 embedding，例如 [10, 14]

visualize:
  show: false # 是否直接弹窗显示图像/视频
  save_frames: false # 是否保存视频的逐帧结果
  save_txt: false # 是否保存 YOLO txt 预测结果
  save_conf: false # 保存 txt 时是否同时保存置信度
  save_crop: false # 是否保存裁剪后的目标区域
  show_labels: true # 可视化时是否显示类别标签
  show_conf: true # 可视化时是否显示置信度
  show_boxes: true # 可视化时是否绘制检测框
  line_width: null # 绘图线宽；null 表示自动根据图像尺寸缩放

export:
  format: torchscript # 导出格式：torchscript | onnx | openvino | engine | coreml ...
  keras: false # 导出 SavedModel 时是否启用 Keras 层
  optimize: false # TorchScript 导出时是否进行移动端优化
  int8: false # 是否导出为 INT8
  dynamic: false # 是否启用动态 shape
  simplify: true # ONNX / TensorRT 导出前是否简化图
  opset: null # ONNX opset；留空时使用官方测试过的默认值
  workspace: null # TensorRT workspace（GiB）
  nms: false # 导出时是否把 NMS 融合进模型

hyperparameters:
  # 说明：box / cls / dfl 是独立的 loss gain，不是概率权重，因此不需要相加等于 1。
  lr0: 0.0054 # 官方 YOLO26n 配方初始学习率
  lrf: 0.0495 # 官方 YOLO26n 配方最终学习率系数
  momentum: 0.947 # 官方 YOLO26n 配方 momentum
  weight_decay: 0.00064 # 官方 YOLO26n 配方权重衰减
  warmup_epochs: 6 # 长 warmup；参考 SGDR 与 PyTorch CosineAnnealingLR
  warmup_momentum: 0.8 # warmup 初始 momentum
  warmup_bias_lr: 0.1 # warmup 期间 bias 的初始学习率
  box: 5.63 # 官方 YOLO26n 配方 box loss gain
  cls: 0.56 # 官方 YOLO26n 配方 classification loss gain
  cls_pw: 0.0 # 类别频率修正强度，0 表示关闭
  dfl: 9.04 # 官方 YOLO26n 配方 distribution focal loss gain；当前仓库的 YOLO26 detect 仍会实际使用
  nbs: 2 # COCO8 排查时与实际 batch 对齐，确保每个 batch 都有优化器更新；正式训练可恢复 64
  wiou_alpha: 1.9 # Wise-IoU v3 alpha；参考 https://arxiv.org/abs/2301.10051 和 https://github.com/Instinct323/wiou
  wiou_delta: 3.0 # Wise-IoU v3 delta
  wiou_momentum: 0.01 # Wise-IoU v3 running mean EMA momentum
  nwd_weight: 0.6 # 小目标 NWD 权重；参考 https://arxiv.org/abs/2110.13389 和 https://github.com/jwwangchn/NWD
  nwd_small_area: 1024.0 # 小目标像素面积阈值：32x32
  nwd_constant: 12.8 # NWD normalized Gaussian Wasserstein constant
  repgt_weight: 0.4 # Repulsion Loss 仅 RepGT 权重；参考 https://arxiv.org/abs/1711.07752
  repulsion_sigma: 0.5 # Repulsion Loss smooth-ln sigma
  tal_topk: 20 # TOOD/TAL dense-crowd one-to-many topk；参考 https://arxiv.org/abs/2108.07755 和 Ultralytics TAL
  tal_topk_one2one: 7 # 仅 end2end=true 时生效；当前关闭 e2e 后不参与训练
  tal_topk_one2one_secondary: 1 # 仅 end2end=true 时生效；当前关闭 e2e 后不参与训练
  cls_pos_weight: 0.75 # BCE 正样本权重；参考 Focal Loss/Detectron2 抑制过度自信

augmentations:
  hsv_h: 0.014 # 官方 YOLO26n 配方 HSV 色调增强强度
  hsv_s: 0.645 # 官方 YOLO26n 配方 HSV 饱和度增强强度
  hsv_v: 0.566 # 官方 YOLO26n 配方 HSV 明度增强强度
  degrees: 1.11 # 官方 YOLO26n 配方旋转增强
  translate: 0.071 # 官方 YOLO26n 配方平移增强比例
  scale: 0.562 # 官方 YOLO26n 配方缩放增强比例
  shear: 1.46 # 官方 YOLO26n 配方错切增强
  perspective: 0.0 # 透视增强强度
  flipud: 0.0 # 上下翻转概率
  fliplr: 0.606 # 官方 YOLO26n 配方左右翻转概率
  bgr: 0.106 # 官方 YOLO26n 配方 BGR 通道交换概率
  mosaic: 0.909 # 官方 YOLO26n 配方 Mosaic 增强概率
  mixup: 0.012 # 官方 YOLO26n 配方 MixUp 增强概率
  cutmix: 0.0 # CutMix 增强概率
  copy_paste: 0.4 # 小目标 Copy-Paste 概率；参考 Simple Copy-Paste/RTMDet
  copy_paste_mode: mixup # detect 任务走跨图 small-object bbox Copy-Paste
  small_copy_paste_area: 0.01 # 仅复制面积占比 <1% 的 bbox
  select_mosaic: true # Select-Mosaic：优先抽取小目标密集样本
  motion_blur: 0.1 # Albumentations MotionBlur 概率
  cached_mixup: true # YOLOX-style Cached MixUp
  mixup_cache_size: 32 # Cached MixUp 缓存容量

tracker:
  tracker: botsort.yaml # 跟踪器配置：botsort.yaml | bytetrack.yaml

raw:
  cfg: null # 可选：再叠加一个 Ultralytics 原生 flat cfg 文件；一般不需要
