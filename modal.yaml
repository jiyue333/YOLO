meta:
  config_version: 2
  description: "YOLO26n small-object recipe with WIoU-v3, NWD, RepGT, CA, SAF, FreqFusion and Select-Mosaic"

experiment:
  task: detect
  mode: train
  project: juliet-heath/bysj
  name: yolo-26n-small-object
  exist_ok: false
  verbose: true
  seed: 0
  deterministic: false

model:
  model: /root/cqu/YOLO/ultralytics-main/ultralytics/cfg/models/26/yolo26-small.yaml
  pretrained: yolo26n.pt
  freeze: null
  compile: false

dataset:
  data: /root/cqu/datasets/crowdhuman-dataset-people-and-faces-19k/data.yaml
  fraction: 0.2 
  single_cls: false

train:
  epochs: 100
  time: null
  patience: 100
  batch: 64
  imgsz: 640
  save: true
  save_period: -1
  cache: false
  device: 0
  workers: 8
  optimizer: SGD
  rect: false
  cos_lr: true
  close_mosaic: 10
  resume: false
  amp: true
  profile: false
  multi_scale: 0.0

segmentation:
  overlap_mask: true
  mask_ratio: 4

classification:
  dropout: 0.0

validation:
  val: true
  split: val
  save_json: false
  conf: 0.01
  iou: 0.7
  max_det: 600
  half: false
  dnn: false
  plots: true
  end2end: false
  visualize: false

prediction:
  source: null
  vid_stride: 1
  stream_buffer: false
  augment: false
  agnostic_nms: false
  classes: null
  retina_masks: false
  embed: null

visualize:
  show: false
  save_frames: false
  save_txt: false
  save_conf: false
  save_crop: false
  show_labels: true
  show_conf: true
  show_boxes: true
  line_width: null

export:
  format: torchscript
  keras: false
  optimize: false
  int8: false
  dynamic: false
  simplify: true
  opset: null
  workspace: null
  nms: false

hyperparameters:
  lr0: 0.05
  lrf: 0.05
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 5.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 5.0
  cls: 0.5
  cls_pw: 0.0
  dfl: 1.5
  pose: 12.0
  kobj: 1.0
  rle: 1.0
  angle: 1.0
  nbs: 64
  use_wiou: true
  wiou_alpha: 1.9
  wiou_delta: 3.0
  wiou_momentum: 0.005
  use_nwd: true
  nwd_weight: 0.1
  nwd_small_area: 1024.3
  nwd_constant: 12.8
  use_repulsion: true
  repgt_weight: 0.05
  repulsion_sigma: 0.5
  tal_topk: 20
  tal_topk_one2one: 7
  tal_topk_one2one_secondary: 1

augmentations:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  bgr: 0.0
  mosaic: 1.0
  select_mosaic: true
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.2
  copy_paste_mode: mixup
  small_copy_paste_area: 0.01
  auto_augment: randaugment
  erasing: 0.4

tracker:
  tracker: botsort.yaml

raw:
  cfg: null
