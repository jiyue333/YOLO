# TPH-YOLOv5 hyperparameters mapped from the workspace modal.yaml.
# Keep this in YOLOv5 hyp format; do not copy unsupported YOLO26/newer-Ultralytics keys here.

lr0: 0.05
lrf: 0.05
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 5.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1

# YOLOv5 uses smaller box/object scalar conventions than newer Ultralytics.
box: 0.05
cls: 0.5
cls_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 0.0

hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.0
copy_paste: 0.2
