# Ablation: add bottom-up AAF only. All AAF nodes use four inputs and are followed by C3k2.

nc: 80
end2end: False
prog_loss: False
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 4, C2PSA, [1024]]

head:
  - [[10, 6], 1, FreqFusion, [512]]
  - [-1, 1, C3k2, [512, True]]

  - [[12, 4], 1, FreqFusion, [256]]
  - [-1, 1, C3k2, [256, True]]

  - [[14, 2], 1, FreqFusion, [128, 5, 3, 1, 3, 1, 32]]
  - [-1, 1, C3k2, [128, True]]

  - [[16, 14], 1, AAF, []]
  - [-1, 1, C3k2, [128, True]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[14, 16, 12, -1], 1, AAF, []]
  - [-1, 1, C3k2, [256, True]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[12, 14, 10, -1], 1, AAF, []]
  - [-1, 1, C3k2, [512, True]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[10, 12, -1], 1, AAF, []]
  - [-1, 1, C3k2, [1024, True, 0.5, True]]

  - [[18, 21, 24, 27], 1, Detect, [nc]]
