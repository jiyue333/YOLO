# Combination ablation: SAF + AAF + CA + ShiftwiseConv with C3k2-style blocks. No RepHMS.
# All heads keep P2-P5 outputs and FreqFusion-enhanced upsampling.

nc: 80
end2end: False
prog_loss: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2Shift, [256, False, 0.25, False, 3]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2Shift, [512, False, 0.25, False, 5]] # 4-P3/8
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2Shift, [512, True, 0.5, False, 7]] # 6-P4/16
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2Shift, [1024, True, 0.5, False, 9]] # 8-P5/32
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 4, C2PSA, [1024]] # 10 actual PSA blocks=2 after nano depth scaling

head:
  - [[10, 6], 1, SAF, []] # 11 P5 SAF boundary: current, previous
  - [-1, 1, C3k2Shift, [1024, True, 0.5, False, 9]] # 12 P5 SAF output

  - [[12, 6], 1, FreqFusion, [512]] # 13 P5 SAF upsample to P4
  - [[6, 4, 10, 13], 1, SAF, []] # 14 P4 SAF
  - [-1, 1, C3k2Shift, [512, True, 0.5, False, 7]] # 15

  - [[15, 4], 1, FreqFusion, [256]] # 16 P4 SAF upsample to P3
  - [[4, 2, 6, 16], 1, SAF, []] # 17 P3 SAF
  - [-1, 1, C3k2Shift, [256, True, 0.5, False, 5]] # 18
  - [-1, 1, CoordAtt, []] # 19 P3

  - [[19, 2], 1, FreqFusion, [128, 5, 3, 1, 3, 1, 32]] # 20 P3 SAF upsample to P2
  - [[2, 0, 4, 20], 1, SAF, []] # 21 P2 SAF
  - [-1, 1, C3k2Shift, [128, False, 0.5, False, 3]] # 22
  - [-1, 1, CoordAtt, []] # 23 P2

  - [[23, 19], 1, AAF, []] # 24 P2 AAF boundary
  - [-1, 1, C3k2Shift, [128, False, 0.5, False, 3]] # 25
  - [-1, 1, CoordAtt, []] # 26 P2

  - [-1, 1, Conv, [128, 3, 2]]
  - [[19, 23, 15, 27], 1, AAF, []] # 28 P3 AAF
  - [-1, 1, C3k2Shift, [256, True, 0.5, False, 5]] # 29
  - [-1, 1, CoordAtt, []] # 30 P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[15, 19, 12, 31], 1, AAF, []] # 32 P4 AAF
  - [-1, 1, C3k2Shift, [512, True, 0.5, False, 7]] # 33
  - [-1, 1, CoordAtt, []] # 34 P4

  - [-1, 1, Conv, [512, 3, 2]]
  - [[12, 15, 35], 1, AAF, []] # 36 P5 AAF boundary
  - [-1, 1, C3k2Shift, [1024, True, 0.5, False, 9]] # 37

  - [[26, 30, 34, 37], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
