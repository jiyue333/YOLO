# YOLO26 small-object detection variant with P2/4 - P5/32 outputs.
# Explicit baseline without ShiftwiseConv paths.
# RepHMS keeps the official MHAF-YOLO large-kernel depthwise convolution path.

# Parameters
nc: 80 # number of classes
end2end: False # standard NMS inference/validation path
prog_loss: False # keep YOLO26 progressive one2one training loss without NMS-free inference
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# MHAF-YOLO-style backbone with RepHMS + GHFKS stage-wise kernels.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RepHMS, [256, 2, 1, 2, 3]] # 2-P2/4 k=3
  - [-1, 1, SimAM, []] # 3 P2 shallow attention
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 1, RepHMS, [512, 3, 1, 2, 5]] # 5-P3/8 shallow k=5
  - [-1, 1, SimAM, []] # 6 P3 shallow attention
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7]] # 8-P4/16 middle k=7
  - [-1, 1, Conv, [1024, 3, 2]] # 9-P5/32
  - [-1, 1, RepHMS, [1024, 3, 1, 2, 9]] # 10-P5/32 deep k=9
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 11
  - [-1, 4, C2PSA, [1024]] # 12 actual PSA blocks=2 after nano depth scaling

# MAFPN neck: top-down SAF and bottom-up AAF, each followed by RepHMS refinement.
head:
  - [[12, 8], 1, SAF, []] # 13 P5 SAF boundary: current, previous
  - [-1, 1, RepHMS, [1024, 2, 1, 2, 9]] # 14 P5 SAF output

  - [[14, 8], 1, FreqFusion, [512]] # 15 P5 SAF upsample to P4
  - [-1, 1, SimAM, []] # 16 P4 top-down attention
  - [[8, 6, 12, 16], 1, SAF, []] # 17 P4 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7]] # 18 P4 SAF output

  - [[18, 6], 1, FreqFusion, [256]] # 19 P4 SAF upsample to P3
  - [-1, 1, SimAM, []] # 20 P3 top-down attention
  - [[6, 3, 8, 20], 1, SAF, []] # 21 P3 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [256, 3, 1, 2, 5]] # 22 P3 SAF output
  - [-1, 1, CoordAtt, []] # 23 P3 attention

  - [[23, 3], 1, FreqFusion, [128, 5, 3, 1, 3, 1, 32]] # 24 P3 SAF upsample to P2
  - [-1, 1, SimAM, []] # 25 P2 top-down attention
  - [[3, 0, 6, 25], 1, SAF, []] # 26 P2 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [128, 2, 1, 2, 3]] # 27 P2 SAF output
  - [-1, 1, CoordAtt, []] # 28 P2 attention

  - [[28, 23], 1, AAF, []] # 29 P2 AAF boundary: current, next
  - [-1, 1, RepHMS, [128, 2, 1, 2, 3]] # 30 P2 AAF output
  - [-1, 1, CoordAtt, []] # 31 P2 output

  - [-1, 1, Conv, [128, 3, 2]] # 32 P2 AAF output downsample to P3
  - [[23, 28, 18, 32], 1, AAF, []] # 33 P3 AAF: current, previous, next, previous-AAF-down
  - [-1, 1, RepHMS, [256, 3, 1, 2, 5]] # 34 P3 AAF output
  - [-1, 1, CoordAtt, []] # 35 P3 output

  - [-1, 1, Conv, [256, 3, 2]] # 36 P3 AAF output downsample to P4
  - [[18, 23, 14, 36], 1, AAF, []] # 37 P4 AAF: current, previous, next, previous-AAF-down
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7]] # 38 P4 AAF output
  - [-1, 1, CoordAtt, []] # 39 P4 output

  - [-1, 1, Conv, [512, 3, 2]] # 40 P4 AAF output downsample to P5
  - [[14, 18, 40], 1, AAF, []] # 41 P5 AAF boundary: current, previous, previous-AAF-down
  - [-1, 1, RepHMS, [1024, 2, 1, 2, 9]] # 42 P5 output

  - [[31, 35, 39, 42], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
