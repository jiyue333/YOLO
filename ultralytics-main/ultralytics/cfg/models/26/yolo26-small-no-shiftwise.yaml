# YOLO26 small-object detection variant with P2/4 - P5/32 outputs.
# Explicit baseline without shifted or large-kernel depthwise convolution paths.
# RepHMS topology is retained, but each block sets use_depthwise=False.

# Parameters
nc: 80 # number of classes
end2end: False # standard NMS inference/validation path
prog_loss: False # keep YOLO26 progressive one2one training loss without NMS-free inference
reg_max: 1 # DFL bins
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# MHAF-YOLO-style backbone with RepHMS topology and standard 3x3 Conv bottlenecks.
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 1, RepHMS, [256, 2, 1, 2, 3, True, 0.5, 3, False]] # 2-P2/4
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 1, RepHMS, [512, 3, 1, 2, 5, True, 0.5, 3, False]] # 4-P3/8 shallow
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7, True, 0.5, 3, False]] # 6-P4/16 middle
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 1, RepHMS, [1024, 3, 1, 2, 9, True, 0.5, 3, False]] # 8-P5/32 deep
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 4, C2PSA, [1024]] # 10 actual PSA blocks=2 after nano depth scaling

# MAFPN neck: top-down SAF and bottom-up AAF, each followed by RepHMS refinement.
head:
  - [[10, 6], 1, SAF, []] # 11 P5 SAF boundary: current, previous
  - [-1, 1, RepHMS, [1024, 2, 1, 2, 9, True, 0.5, 3, False]] # 12 P5 SAF output

  - [[12, 6], 1, FreqFusion, [512]] # 13 P5 SAF upsample to P4
  - [[6, 4, 10, 13], 1, SAF, []] # 14 P4 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7, True, 0.5, 3, False]] # 15 P4 SAF output

  - [[15, 4], 1, FreqFusion, [256]] # 16 P4 SAF upsample to P3
  - [[4, 2, 6, 16], 1, SAF, []] # 17 P3 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [256, 3, 1, 2, 5, True, 0.5, 3, False]] # 18 P3 SAF output
  - [-1, 1, CoordAtt, []] # 19 P3 attention

  - [[19, 2], 1, FreqFusion, [128, 5, 3, 1, 3, 1, 32]] # 20 P3 SAF upsample to P2
  - [[2, 0, 4, 20], 1, SAF, []] # 21 P2 SAF: current, previous, next, next-SAF-up
  - [-1, 1, RepHMS, [128, 2, 1, 2, 3, True, 0.5, 3, False]] # 22 P2 SAF output
  - [-1, 1, CoordAtt, []] # 23 P2 attention

  - [[23, 19], 1, AAF, []] # 24 P2 AAF boundary: current, next
  - [-1, 1, RepHMS, [128, 2, 1, 2, 3, True, 0.5, 3, False]] # 25 P2 AAF output
  - [-1, 1, CoordAtt, []] # 26 P2 output

  - [-1, 1, Conv, [128, 3, 2]] # 27 P2 AAF output downsample to P3
  - [[19, 23, 15, 27], 1, AAF, []] # 28 P3 AAF: current, previous, next, previous-AAF-down
  - [-1, 1, RepHMS, [256, 3, 1, 2, 5, True, 0.5, 3, False]] # 29 P3 AAF output
  - [-1, 1, CoordAtt, []] # 30 P3 output

  - [-1, 1, Conv, [256, 3, 2]] # 31 P3 AAF output downsample to P4
  - [[15, 19, 12, 31], 1, AAF, []] # 32 P4 AAF: current, previous, next, previous-AAF-down
  - [-1, 1, RepHMS, [512, 3, 1, 2, 7, True, 0.5, 3, False]] # 33 P4 AAF output
  - [-1, 1, CoordAtt, []] # 34 P4 output

  - [-1, 1, Conv, [512, 3, 2]] # 35 P4 AAF output downsample to P5
  - [[12, 15, 35], 1, AAF, []] # 36 P5 AAF boundary: current, previous, previous-AAF-down
  - [-1, 1, RepHMS, [1024, 2, 1, 2, 9, True, 0.5, 3, False]] # 37 P5 output

  - [[26, 30, 34, 37], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
