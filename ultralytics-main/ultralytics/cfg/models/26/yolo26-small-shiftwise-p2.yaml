# Ablation: add ShiftwiseConv only through C3k2Shift. Common baseline keeps P2-P5 heads and FreqFusion upsampling.

nc: 80
end2end: False
prog_loss: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2Shift, [256, False, 0.25, False, 3]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2Shift, [512, False, 0.25, False, 5]]
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2Shift, [512, True, 0.5, False, 7]]
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2Shift, [1024, True, 0.5, False, 9]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 4, C2PSA, [1024]]

head:
  - [[10, 6], 1, FreqFusion, [512]]
  - [-1, 1, C3k2Shift, [512, True, 0.5, False, 7]]

  - [[12, 4], 1, FreqFusion, [256]]
  - [-1, 1, C3k2Shift, [256, True, 0.5, False, 5]]

  - [[14, 2], 1, FreqFusion, [128, 5, 3, 1, 3, 1, 32]]
  - [-1, 1, C3k2Shift, [128, False, 0.5, False, 3]]

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 1, C3k2Shift, [256, True, 0.5, False, 5]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, C3k2Shift, [512, True, 0.5, False, 7]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 1, C3k2Shift, [1024, True, 0.5, False, 9]]

  - [[16, 19, 22, 25], 1, Detect, [nc]]
